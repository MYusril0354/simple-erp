<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem ERP Gudang & Penjualan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <!-- Chart.js Datalabels Plugin (untuk menampilkan angka di atas bar chart) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Memaksa elemen disembunyikan agar tidak ditimpa Tailwind */
        .hidden-hash { display: none !important; }
        
        /* Custom scrollbar untuk tabel */
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-[110] transform transition-all duration-300 translate-x-full opacity-0 max-w-sm w-full bg-white shadow-xl rounded-lg border-l-4 p-4 flex items-start gap-3">
        <i data-lucide="info" id="toast-icon" class="text-gray-500 mt-0.5"></i>
        <div id="toast-message" class="text-sm font-medium text-gray-700 mt-1"></div>
    </div>

    <!-- Loading Overlay (Hanya untuk Aksi Simpan/Proses) -->
    <div id="loading" class="fixed inset-0 bg-gray-900 bg-opacity-60 z-[100] flex items-center justify-center hidden backdrop-blur-sm">
        <div class="bg-white px-8 py-6 rounded-xl shadow-2xl flex flex-col items-center gap-4">
            <div class="loader"></div>
            <p class="text-sm font-semibold text-gray-700 tracking-wide">Memproses Data...</p>
        </div>
    </div>

    <!-- App Container -->
    <div id="app">
        <!-- Auth View -->
        <div id="view-login" class="min-h-screen flex items-center justify-center hidden-hash bg-gradient-to-br from-blue-900 to-indigo-800 p-4">
            <div class="bg-white p-8 md:p-10 rounded-2xl shadow-2xl w-full max-w-md transform transition-all">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4 shadow-inner">
                        <i data-lucide="boxes" class="w-8 h-8 text-blue-600"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold text-gray-800">ERP System</h1>
                    <p class="text-gray-500 text-sm mt-2">Log in untuk mengakses panel manajemen</p>
                </div>
                <form id="form-login" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-lucide="user" class="h-5 w-5 text-gray-400"></i>
                            </div>
                            <input type="text" id="login-username" required class="block w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-lucide="lock" class="h-5 w-5 text-gray-400"></i>
                            </div>
                            <input type="password" id="login-password" required class="block w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                        </div>
                    </div>
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all active:scale-[0.98]">
                        Masuk Sistem
                    </button>
                </form>
            </div>
        </div>

        <!-- Main Layout (Sidebar + Content) -->
        <div id="view-main" class="flex h-screen overflow-hidden hidden-hash">
            
            <!-- Sidebar -->
            <aside id="sidebar" class="bg-[#1e293b] text-white w-64 flex-shrink-0 absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-300 ease-in-out z-30 shadow-xl flex flex-col">
                <div class="h-16 flex items-center justify-between px-5 bg-[#0f172a] shadow-md">
                    <span class="text-lg font-bold flex items-center gap-3 tracking-wide"><i data-lucide="boxes" class="text-blue-400"></i> ERP Panel</span>
                    <button id="close-sidebar" class="md:hidden text-gray-400 hover:text-white transition-colors">
                        <i data-lucide="x"></i>
                    </button>
                </div>
                <div class="px-5 py-4 border-b border-gray-700 bg-gray-800/50">
                    <p class="text-xs text-gray-400 mb-1">Akun Aktif:</p>
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm shadow-inner" id="user-initial">U</div>
                        <p class="text-sm font-semibold truncate text-gray-100" id="user-info-sidebar">User</p>
                    </div>
                </div>
                <nav class="p-3 space-y-1 overflow-y-auto flex-1" id="nav-menu">
                    <!-- Nav items injected dynamically -->
                </nav>
                <div class="p-4 border-t border-gray-700 bg-[#0f172a]">
                    <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-red-400 bg-red-400/10 hover:bg-red-500 hover:text-white rounded-lg transition-all">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
                    </button>
                </div>
            </aside>

            <!-- Content Area -->
            <div class="flex-1 flex flex-col w-full relative bg-gray-50 overflow-hidden">
                <!-- Topbar -->
                <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 md:px-6 z-20 sticky top-0 flex-shrink-0">
                    <div class="flex items-center gap-4">
                        <button id="open-sidebar" class="md:hidden text-gray-600 hover:text-gray-900 focus:outline-none bg-gray-100 p-2 rounded-md">
                            <i data-lucide="menu"></i>
                        </button>
                        <h2 id="page-title" class="text-xl font-bold text-gray-800 tracking-tight">Dashboard</h2>
                    </div>
                    <div class="hidden md:flex items-center text-sm text-gray-500 font-medium">
                        <i data-lucide="calendar" class="w-4 h-4 mr-2"></i>
                        <span id="current-date"></span>
                    </div>
                </header>

                <!-- Main Content -->
                <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-6 relative" id="main-content">
                    <!-- Dynamic Content Injected Here -->
                </main>
            </div>
            
            <!-- Mobile Sidebar Overlay -->
            <div id="sidebar-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-20 hidden md:hidden backdrop-blur-sm transition-opacity"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI APLIKASI
        // ==========================================
        // GANTI URL DI BAWAH DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const API_URL = "https://script.google.com/macros/s/AKfycbwBGr5r9NlxC8Bv0Z1bDeKWwoA6T2kuDiyUZ4T8uwo3Rp1Aq8CJSCUUO7e76xoL4elG/exec"; 
        // URL Web App dari project Apps Script TERPISAH (di-deploy pakai akun Google khusus)
        // yang tugasnya HANYA mengirim email notifikasi PO baru ke snamemedika@gmail.com.
        // Ganti nilai di bawah ini dengan URL Web App hasil deploy project po_email_sender.gs.
        const PO_EMAIL_API_URL = "https://script.google.com/macros/s/AKfycbzYZyDvtoPJTZlPtt-8PGxXOYxBrnknUemODJK3DTMQ7QEjHrAeu08slaKZ6bgbNlN5/exec";
        
        let currentUser = null;

        // Daftarkan plugin Chart.js Datalabels secara global (dipakai untuk label angka di atas bar chart)
        if (typeof ChartDataLabels !== 'undefined') {
            Chart.register(ChartDataLabels);
        }

        // Set Date in Topbar
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('id-ID', dateOptions);

        // ==========================================
        // UTILITIES & UI HELPERS
        // ==========================================
        function showLoading() { document.getElementById('loading').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading').classList.add('hidden'); }

        // --- Fungsi Skeleton Loading Global ---
        function getSkeletonHTML() {
            return `
                <div class="animate-pulse space-y-6 w-full">
                    <!-- Header Action Bar Skeleton -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-2">
                        <div class="h-8 bg-gray-200 rounded w-1/3 sm:w-64"></div>
                        <div class="h-10 bg-gray-200 rounded w-full sm:w-32"></div>
                    </div>
                    <!-- Cards Skeleton (3 cols) -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="h-32 bg-white border border-gray-100 shadow-sm rounded-xl flex flex-col justify-center p-6"><div class="h-4 bg-gray-200 rounded w-1/2 mb-3"></div><div class="h-8 bg-gray-200 rounded w-1/4"></div></div>
                        <div class="h-32 bg-white border border-gray-100 shadow-sm rounded-xl flex flex-col justify-center p-6"><div class="h-4 bg-gray-200 rounded w-1/2 mb-3"></div><div class="h-8 bg-gray-200 rounded w-1/4"></div></div>
                        <div class="h-32 bg-white border border-gray-100 shadow-sm rounded-xl flex flex-col justify-center p-6"><div class="h-4 bg-gray-200 rounded w-1/2 mb-3"></div><div class="h-8 bg-gray-200 rounded w-1/4"></div></div>
                    </div>
                    <!-- Main Table/Content Skeleton -->
                    <div class="h-96 bg-white border border-gray-100 shadow-sm rounded-xl w-full p-6">
                        <div class="h-6 bg-gray-200 rounded w-1/4 mb-6"></div>
                        <div class="space-y-4">
                            <div class="h-10 bg-gray-100 rounded w-full"></div>
                            <div class="h-10 bg-gray-50 rounded w-full"></div>
                            <div class="h-10 bg-gray-50 rounded w-full"></div>
                            <div class="h-10 bg-gray-50 rounded w-full"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Fungsi Helper untuk Mencetak Laporan ke Tab Baru ---
        window.cetakDokumenLaporan = function(title, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return showToast('Area cetak tidak ditemukan', 'error');
            
            const content = container.innerHTML;
            const win = window.open('', '_blank');
            if (!win) {
                showToast('Popup diblokir browser. Izinkan popup untuk mencetak.', 'error');
                return;
            }
            
            const printHtml = `
            <!DOCTYPE html>
            <html lang="id">
            <head>
                <meta charset="UTF-8">
                <title>Cetak - ${title}</title>
                <!-- Load Tailwind untuk styling cetakan -->
                <script src="https://cdn.tailwindcss.com"><\/script>
                <style>
                    /* Konfigurasi Kertas Landscape A4 */
                    @page { size: A4 landscape; margin: 15mm; }
                    
                    /* Paksa warna background (seperti header biru) tetap tercetak */
                    body { 
                        -webkit-print-color-adjust: exact !important; 
                        print-color-adjust: exact !important; 
                        background-color: white !important; 
                        font-size: 11px;
                        font-family: Arial, sans-serif;
                    }
                    
                    /* Sembunyikan elemen yang tidak perlu di kertas (Tombol, Navigasi) */
                    .no-print, button { display: none !important; }
                    
                    /* Hilangkan bayangan dan border melengkung agar terlihat formal */
                    .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; }
                    .rounded-xl, .rounded-lg, .rounded-md { border-radius: 0 !important; }
                    
                    /* Izinkan tabel melewati batas container (hilangkan scrollbar di kertas) */
                    .overflow-x-auto, .overflow-hidden, .max-w-full { 
                        overflow: visible !important; 
                        max-width: none !important; 
                        width: 100% !important; 
                    }
                    
                    /* Pertegas Border Tabel di Kertas */
                    table { border-collapse: collapse !important; width: 100% !important; }
                    th, td { border: 1px solid #444 !important; }
                    .border, .border-gray-200, .border-gray-300 { border-color: #444 !important; }
                </style>
            </head>
            <body class="bg-white text-black p-4">
                <div class="mb-6 pb-4 border-b-2 border-gray-800 flex justify-between items-end">
                    <div>
                        <h2 class="text-2xl font-bold uppercase tracking-wider text-gray-900">${title}</h2>
                        <p class="text-sm text-gray-600 mt-1 font-semibold">PT SINARAYA NUGRAHA AHMADARIS MEDIKA</p>
                    </div>
                    <div class="text-right text-xs text-gray-500">
                        Dicetak pada:<br><b class="text-gray-800">${new Date().toLocaleString('id-ID')}</b>
                    </div>
                </div>
                
                <!-- Konten Tabel yang Diambil dari Layar Utama -->
                <div id="print-content" class="text-sm w-full">
                    ${content}
                </div>
                
                <script>
                    // Tunggu 1.5 detik agar Tailwind CDN selesai merender class, lalu buka Print Dialog
                    setTimeout(() => {
                        window.print();
                    }, 1500);
                <\/script>
            </body>
            </html>
            `;
            
            win.document.write(printHtml);
            win.document.close();
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const icon = document.getElementById('toast-icon');
            
            msgEl.textContent = message;
            toast.classList.remove('translate-x-full', 'opacity-0');
            toast.classList.remove('border-green-500', 'border-red-500', 'border-blue-500');
            
            if (type === 'success') {
                toast.classList.add('border-green-500');
                icon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>'; 
                icon.setAttribute('class', 'text-green-500 w-6 h-6 mt-0.5');
            } else if (type === 'error') {
                toast.classList.add('border-red-500');
                icon.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>'; 
                icon.setAttribute('class', 'text-red-500 w-6 h-6 mt-0.5');
            }

            lucide.createIcons();

            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 3500);
        }

        async function fetchAPI(action, payload = {}, forceOverlay = false) {
            // Daftar endpoint yang hanya bertugas me-load data tampilan (Bukan Aksi Simpan)
            const isViewDataFetch = ['getDashboardData', 'getMaster', 'getPOList', 'getStokPerRak', 'getAntreanSJ', 'getSuratJalanList', 'getKartuStok', 'getLaporanPersiapan'].includes(action);
            
            // Tampilkan Overlay Hitam HANYA jika dipaksa (forceOverlay) atau jika aksinya BUKAN memuat data view
            const useOverlay = forceOverlay || !isViewDataFetch;
            
            if (useOverlay) showLoading();
            
            try {
                const token = localStorage.getItem('erp_token') || "";
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, payload, token })
                });
                const result = await response.json();
                
                if (useOverlay) hideLoading();
                
                if (!result.success && result.message.includes('Token Expired')) {
                    logout();
                    showToast('Sesi telah habis, silakan login kembali', 'error');
                    return null;
                }
                return result;
            } catch (error) {
                if (useOverlay) hideLoading();
                showToast('Koneksi ke server gagal. Pastikan URL API benar.', 'error');
                console.error(error);
                return null;
            }
        }

        // ==========================================
        // ROUTING & AUTH
        // ==========================================
        function initApp() {
            const token = localStorage.getItem('erp_token');
            const role = localStorage.getItem('erp_role');
            const username = localStorage.getItem('erp_username');
            
            if (token && role) {
                currentUser = { token, role, username };
                document.getElementById('view-login').classList.add('hidden-hash');
                document.getElementById('view-main').classList.remove('hidden-hash');
                
                const displayRole = role.replace('_', ' ').toUpperCase();
                document.getElementById('user-info-sidebar').textContent = `${username} (${displayRole})`;
                document.getElementById('user-initial').textContent = username.charAt(0).toUpperCase();
                
                buildMenu();
                lucide.createIcons();
                
                if (window.location.hash === '' || window.location.hash === '#login') {
                    window.location.hash = '#dashboard';
                } else {
                    handleRoute();
                }
            } else {
                document.getElementById('view-login').classList.remove('hidden-hash');
                document.getElementById('view-main').classList.add('hidden-hash');
                window.location.hash = '#login';
            }
        }

        function logout() {
            localStorage.removeItem('erp_token');
            localStorage.removeItem('erp_role');
            localStorage.removeItem('erp_username');
            currentUser = null;
            initApp();
        }

        window.addEventListener('hashchange', handleRoute);

        function handleRoute() {
            if (!currentUser && window.location.hash !== '#login') {
                window.location.hash = '#login';
                return;
            }
            
            const hash = window.location.hash.substring(1);
            const content = document.getElementById('main-content');
            
            // TAMPILKAN SKELETON SEBELUM MULAI FETCH DATA HALAMAN
            content.innerHTML = getSkeletonHTML(); 
            
            // Highlight active menu
            document.querySelectorAll('#nav-menu a').forEach(el => {
                el.classList.remove('bg-blue-600', 'text-white', 'shadow-md');
                el.classList.add('text-gray-300', 'hover:bg-gray-800', 'hover:text-white');
                if(el.getAttribute('href') === '#' + hash) {
                    el.classList.remove('text-gray-300', 'hover:bg-gray-800', 'hover:text-white');
                    el.classList.add('bg-blue-600', 'text-white', 'shadow-md');
                }
            });

            // Route Switcher
            switch (hash) {
                case 'dashboard': renderDashboard(); break;
                case 'master-barang': renderMaster('Barang'); break;
                case 'master-customer': renderMaster('Customer'); break;
                case 'master-rak': renderMaster('Rak'); break;
                case 'penerimaan': renderPenerimaan(); break;
                case 'input-po': renderInputPO(); break;
                case 'outstanding': renderDaftarPO(); break;
                case 'rekap-po': renderRekapPO(); break;
                case 'persiapan': renderPersiapan(); break;
                case 'laporan-persiapan': renderLaporanPersiapan(); break;
                case 'surat-jalan': renderSuratJalan(); break;
                case 'kartu-stok': renderKartuStok(); break;
                case 'user-management': renderUserManagement(); break;
                default: 
                    if(currentUser) renderDashboard();
            }
            
            // Close sidebar on mobile after click
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('hidden');
        }

        // ==========================================
        // MENU BUILDER
        // ==========================================
        const MENU_CONFIG = [
            { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard', roles: ['super_user', 'penerima_order', 'gudang', 'ppic'] },
            { id: 'master-barang', label: 'Master Barang', icon: 'box', roles: ['super_user', 'gudang'] },
            { id: 'master-customer', label: 'Master Customer', icon: 'users', roles: ['super_user', 'penerima_order'] },
            { id: 'master-rak', label: 'Master Rak', icon: 'layers', roles: ['super_user', 'gudang'] },
            { id: 'penerimaan', label: 'Penerimaan Stok', icon: 'arrow-down-to-line', roles: ['super_user', 'gudang'] },
            { id: 'input-po', label: 'Input PO', icon: 'shopping-cart', roles: ['super_user', 'penerima_order'] },
            { id: 'outstanding', label: 'Outstanding PO', icon: 'list-ordered', roles: ['super_user', 'penerima_order', 'gudang', 'ppic'] },
            { id: 'rekap-po', label: 'Rekap Seluruh PO', icon: 'clipboard-list', roles: ['super_user', 'penerima_order', 'gudang', 'ppic'] },
            { id: 'persiapan', label: 'Persiapan Barang', icon: 'package-search', roles: ['super_user', 'gudang'] },
            { id: 'laporan-persiapan', label: 'Laporan Persiapan', icon: 'clipboard-check', roles: ['super_user', 'gudang', 'ppic'] },
            { id: 'surat-jalan', label: 'Surat Jalan', icon: 'truck', roles: ['super_user', 'gudang'] },
            { id: 'kartu-stok', label: 'Kartu Stok', icon: 'file-spreadsheet', roles: ['super_user', 'gudang', 'ppic'] },
            { id: 'user-management', label: 'Manajemen User', icon: 'user-cog', roles: ['super_user'] },
        ];

        function buildMenu() {
            const nav = document.getElementById('nav-menu');
            nav.innerHTML = '';
            MENU_CONFIG.forEach(item => {
                if (item.roles.includes(currentUser.role)) {
                    const a = document.createElement('a');
                    a.href = '#' + item.id;
                    a.className = 'flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg transition-all duration-200';
                    a.innerHTML = `<i data-lucide="${item.icon}" class="w-5 h-5"></i> ${item.label}`;
                    nav.appendChild(a);
                }
            });
        }

        // ==========================================
        // VIEWS / RENDERERS
        // ==========================================
        function setPageTitle(title) {
            document.getElementById('page-title').textContent = title;
        }

        // Helper untuk membuar Card putih rapi dan menahan lebar tabel (overflow-hidden)
        function createCard(html, classes = "") {
            return `<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-5 w-full max-w-full overflow-hidden ${classes}">${html}</div>`;
        }

        // --- DASHBOARD ---
        async function renderDashboard() {
            setPageTitle('Dashboard');
            const [res, antreanSJRes] = await Promise.all([
                fetchAPI('getDashboardData'),
                fetchAPI('getAntreanSJ')
            ]);
            if (!res || !res.success) return;

            const drBelumSJ = (antreanSJRes && antreanSJRes.success) ? antreanSJRes.data.length : 0;

            const html = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between relative overflow-hidden group">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-blue-500 rounded-l-xl transition-all group-hover:w-2"></div>
                        <div><p class="text-gray-500 text-sm font-medium mb-1">PO Status Open</p><h3 class="text-3xl font-extrabold text-gray-800">${res.data.openPO}</h3></div>
                        <div class="p-3 bg-blue-50 rounded-lg"><i data-lucide="clipboard-list" class="w-8 h-8 text-blue-500"></i></div>
                    </div>

        // Memicu pengiriman email notifikasi PO baru lewat Web App Apps Script
        // yang di-deploy di akun Google TERPISAH (lihat PO_EMAIL_API_URL).
        // Dibuat fire-and-forget (tidak di-await, error hanya di-log ke console)
        // supaya kalau email gagal terkirim, alur input PO di UI tetap lancar.
        function kirimEmailNotifikasiPOBaru(no_po, kodeCustomer, items, listCustomer, listBarang) {
            if (!PO_EMAIL_API_URL || PO_EMAIL_API_URL.includes('PASTE_URL')) {
                console.warn('PO_EMAIL_API_URL belum diisi, notifikasi email PO dilewati.');
                return;
            }

            const namaCustomer = (listCustomer || []).find(c => c.kode_customer === kodeCustomer)?.nama_customer || kodeCustomer;
            const itemsWithName = items.map(it => {
                const b = (listBarang || []).find(x => x.kode_barang === it.kode_barang);
                return { kode_barang: it.kode_barang, nama_barang: b?.nama_barang || it.kode_barang, qty: it.qty };
            });

            fetch(PO_EMAIL_API_URL, {
                method: 'POST',
                mode: 'no-cors', // Web App di akun lain tidak set header CORS; kita tidak butuh baca responsenya
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight
                body: JSON.stringify({
                    jenis: 'po_baru',
                    no_po: no_po,
                    customer: namaCustomer,
                    items: itemsWithName,
                    dibuat_oleh: currentUser?.username || '-',
                    tanggal: new Date().toLocaleString('id-ID')
                })
            }).catch(err => console.warn('Gagal memicu email notifikasi PO:', err));
        }

        // Memicu email notifikasi Penerimaan Barang (stok masuk) lewat Web App yang sama.
        // Sama seperti notifikasi PO: fire-and-forget, tidak mengganggu alur UI kalau gagal.
        function kirimEmailNotifikasiPenerimaan(kodeBarang, kodeRak, qty, keterangan, saldoSetelah, listBarang) {
            if (!PO_EMAIL_API_URL || PO_EMAIL_API_URL.includes('PASTE_URL')) {
                console.warn('PO_EMAIL_API_URL belum diisi, notifikasi email penerimaan barang dilewati.');
                return;
            }

            const barang = (listBarang || []).find(b => b.kode_barang === kodeBarang);

            fetch(PO_EMAIL_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    jenis: 'penerimaan_barang',
                    kode_barang: kodeBarang,
                    nama_barang: barang?.nama_barang || kodeBarang,
                    satuan: barang?.satuan || '',
                    qty: qty,
                    kode_rak: kodeRak,
                    stok_saat_ini: saldoSetelah,
                    keterangan: keterangan,
                    diterima_oleh: currentUser?.username || '-',
                    tanggal: new Date().toLocaleString('id-ID')
                })
            }).catch(err => console.warn('Gagal memicu email notifikasi penerimaan barang:', err));
        }

        // --- OUTSTANDING PO (GROUPED PER ITEM) ---
        async function renderDaftarPO() {
            setPageTitle('Outstanding PO (Belum Terkirim)');
            const [poRes, barangRes, stokRes] = await Promise.all([
                fetchAPI('getPOList'), fetchAPI('getMaster', { type: 'Barang' }), fetchAPI('getStokPerRak')
            ]);
            if(!poRes || !poRes.success) return;

            const masterBarang = {}; const masterSatuan = {};
            if (barangRes && barangRes.success) {
                barangRes.data.forEach(b => {
                    let kb = String(b.kode_barang).trim().toUpperCase();
                    masterBarang[kb] = b.nama_barang;
                    masterSatuan[kb] = b.satuan;
                });
            }

            const stokGudang = {};
            if (stokRes && stokRes.success) {
                stokRes.data.forEach(s => {
                    let kb = String(s.kode_barang).trim().toUpperCase();
                    if (!stokGudang[kb]) stokGudang[kb] = 0;
                    stokGudang[kb] += (parseInt(s.qty, 10) || 0);
                });
            }

            const groupedData = {};
            poRes.data.forEach(po => {
                if (po.status === 'Selesai') return; 
                po.items.forEach(item => {
                    const kode = String(item.kode_barang).trim().toUpperCase();
                    const pesanan = parseInt(item.qty_pesanan, 10) || 0;
                    const terkirim = parseInt(item.qty_terkirim, 10) || 0;
                    const outstanding = pesanan - terkirim;
                    if (outstanding <= 0) return;

                    if (!groupedData[kode]) {
                        groupedData[kode] = {
                            kode_barang: kode, nama_barang: masterBarang[kode] || 'Unknown', satuan: masterSatuan[kode] || '-',
                            list: [], total_pesanan: 0, total_terkirim: 0, total_outstanding: 0, stok_gudang: stokGudang[kode] || 0
                        };
                    }
                    groupedData[kode].list.push({
                        no_po: po.no_po, tanggal: po.tanggal, customer: po.customer,
                        qty_pesanan: pesanan, qty_terkirim: terkirim, qty_os: outstanding
                    });
                    groupedData[kode].total_pesanan += pesanan;
                    groupedData[kode].total_terkirim += terkirim;
                    groupedData[kode].total_outstanding += outstanding;
                });
            });

            let htmlContent = '';
            const groups = Object.values(groupedData);

            if (groups.length === 0) {
                htmlContent = '<div class="p-8 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-200"><i data-lucide="check-circle" class="w-12 h-12 mx-auto text-green-300 mb-3"></i>Semua pesanan telah terpenuhi. Tidak ada Outstanding PO.</div>';
            } else {
                groups.forEach((group, index) => {
                    const rows = group.list.map((item, i) => `
                        <tr class="border-b border-gray-200 hover:bg-blue-50/50 bg-white transition-colors text-gray-700">
                            <td class="px-3 py-2.5 text-center">${i + 1}</td>
                            <td class="px-3 py-2.5 font-medium text-blue-700">${item.no_po}</td>
                            <td class="px-3 py-2.5">${new Date(item.tanggal).toLocaleDateString('id-ID')}</td>
                            <td class="px-3 py-2.5">${item.customer}</td>
                            <td class="px-3 py-2.5 text-center">${group.satuan}</td>
                            <td class="px-3 py-2.5 text-right font-medium">${item.qty_pesanan.toLocaleString('id-ID')}</td>
                            <td class="px-3 py-2.5 text-right">${item.qty_terkirim.toLocaleString('id-ID')}</td>

                                <td class="px-3 py-2.5 text-center align-middle bg-gray-50 border-l border-gray-200" rowspan="${rowCount}">

                    } else {
                        rows += `
                            <tr class="hover:bg-blue-50/30 transition-colors">
                                <td class="px-3 py-2 border-b border-gray-100 font-medium text-gray-700 text-xs">${itemName}</td>
                                <td class="px-3 py-2 border-b border-gray-100 text-center">${pesanan}</td>
                                <td class="px-3 py-2 border-b border-gray-100 text-center text-blue-600 font-semibold">${terkirim}</td>
                                <td class="px-3 py-2 border-b border-gray-100 text-center font-bold ${sisa > 0 ? 'text-red-500' : 'text-green-500'}">${sisa}</td>

                    <h2 class="text-xl font-bold text-gray-800">Daftar Transaksi Keseluruhan PO</h2>
                    <button onclick="cetakDokumenLaporan('Rekapitulasi Seluruh PO', 'print-rekap-container')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg shadow-sm hover:bg-indigo-700 flex items-center justify-center gap-2 font-semibold transition-all">
                        <i data-lucide="printer" class="w-4 h-4"></i> Cetak Rekap
                    </button>
                </div>
                
                <div id="print-rekap-container">
                    ${createCard(`
                        <div class="overflow-x-auto w-full max-w-full rounded-lg border-2 border-gray-200">
                            <table class="w-full text-sm text-left whitespace-nowrap">
                                <thead class="bg-gray-200 text-gray-800 font-bold border-b-2 border-gray-300">
                                    <tr>
                                        <th class="px-3 py-3 border-r border-gray-300">No PO</th>
                                        <th class="px-3 py-3 border-r border-gray-300">Tanggal</th>
                                        <th class="px-3 py-3 border-r border-gray-300">Customer</th>
                                        <th class="px-3 py-3 w-64 text-indigo-700">Nama Barang</th>

                                <tbody>${rows || '<tr><td colspan="9" class="text-center py-8 text-gray-500 font-medium">Belum ada data Transaksi PO</td></tr>'}</tbody>

        // --- PERSIAPAN BARANG (DELIVERY REQUEST) ---
        async function renderPersiapan() {
            setPageTitle('Persiapan Barang (Gudang)');
            const res = await fetchAPI('getPOList');
            if(!res || !res.success) return;

            const openPOs = res.data.filter(p => p.status === 'Open');
            const rows = openPOs.map(po => `
                <div class="flex flex-col md:flex-row md:items-center justify-between p-4 bg-white border border-gray-200 rounded-xl mb-3 hover:shadow-md transition-shadow group">
                    <div class="mb-3 md:mb-0">
                        <h4 class="font-extrabold text-gray-800 text-lg flex items-center gap-2"><i data-lucide="file-text" class="w-5 h-5 text-indigo-500"></i> ${po.no_po}</h4>
                        <p class="text-sm text-gray-500 mt-1 font-medium"><i data-lucide="user" class="inline w-3 h-3 mr-1"></i> ${po.customer} &nbsp;|&nbsp; <i data-lucide="layers" class="inline w-3 h-3 mr-1"></i> Total Item: ${po.items.length}</p>
                    </div>
                    <button onclick="prosesAlokasiPO('${po.no_po}')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg shadow-sm hover:bg-indigo-700 flex items-center justify-center gap-2 font-semibold transition-all">
                        <i data-lucide="scan-barcode" class="w-4 h-4"></i> Siapkan Barang (FIFO)
                    </button>

            const html = `
                <div class="max-w-4xl mx-auto">
                    <h3 class="font-bold text-gray-700 mb-4 px-1">Daftar PO Perlu Disiapkan (Status: Open)</h3>
                    ${rows || '<div class="p-8 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-200"><i data-lucide="coffee" class="w-12 h-12 mx-auto text-gray-300 mb-3"></i>Tidak ada PO baru yang berstatus Open saat ini.</div>'}
                </div>
                
                <!-- Modal Alokasi FIFO -->
                <div id="modal-alokasi" class="fixed inset-0 bg-gray-900 bg-opacity-60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
                    <div class="bg-white rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl transform transition-all">
                        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                            <h3 class="font-bold text-gray-800 text-lg flex items-center gap-2"><i data-lucide="cpu" class="text-indigo-600"></i> Usulan Alokasi Stok FIFO</h3>
                            <button onclick="closeModalAlokasi()" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-1.5 rounded-lg transition-colors"><i data-lucide="x"></i></button>

                        <div class="p-6" id="alokasi-content"></div>
                    </div>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
            lucide.createIcons();
        }

        let alokasiState = { no_po: null, alokasi: [] };
        window.prosesAlokasiPO = async function(no_po) {
            const [res, rakRes] = await Promise.all([ fetchAPI('getDeliveryAlokasi', { no_po }), fetchAPI('getMaster', { type: 'Rak' }) ]);
            if(!res.success) return showToast(res.message, 'error');

            const masterRak = {};
            if(rakRes && rakRes.success) {
                rakRes.data.forEach(r => masterRak[String(r.kode_rak).trim().toUpperCase()] = r.nama_rak);
            }

            const alokasi = res.data;
            alokasiState = { no_po, alokasi };
            const tBody = alokasi.map(a => {
                let namaRak = masterRak[String(a.kode_rak).trim().toUpperCase()] || a.kode_rak;
                return `
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="py-2.5 px-3 font-medium text-gray-700">${a.nama_barang || a.kode_barang}</td>
                    <td class="py-2.5 px-3 text-center"><span class="bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-md text-xs font-bold">${namaRak}</span></td>
                    <td class="py-2.5 px-3 text-center font-black text-green-600 text-base">${a.qty_alokasi}</td>
                </tr>`
            }).join('');

            const content = `
                <div class="bg-indigo-50 border border-indigo-100 text-indigo-800 p-4 rounded-lg mb-5 text-sm flex gap-3">
                    <i data-lucide="info" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
                    <p>Sistem telah menghitung usulan pengambilan stok FIFO. <b>Jika stok gudang kurang dari pesanan, sistem hanya akan mengalokasikan stok yang tersedia saat ini (Pengiriman Parsial)</b>. Sisa barang akan tetap berstatus Outstanding.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Tanggal Kirim <span class="text-red-500">*</span></label>
                        <input id="input-tanggal-kirim" type="date" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Ekspedisi <span class="text-red-500">*</span></label>
                        <input id="input-ekspedisi-persiapan" type="text" placeholder="Contoh: 21 EXPRESS" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <div class="overflow-x-auto border border-gray-200 rounded-lg mb-6">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-100 text-gray-700 border-b border-gray-200">
                            <tr><th class="py-3 px-3">Nama Barang</th><th class="py-3 px-3 text-center w-36">Rak Sumber</th><th class="py-3 px-3 text-center w-28">Qty Diambil</th></tr>
                        </thead>
                        <tbody>${tBody}</tbody>
                    </table>
                </div>
                <div class="flex flex-col sm:flex-row justify-end gap-3 pt-2 border-t border-gray-100">
                    <button onclick="closeModalAlokasi()" class="px-5 py-2.5 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition-colors">Batal</button>
                    <button onclick='konfirmasiAlokasi()' class="px-5 py-2.5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 flex items-center justify-center gap-2 shadow-md transition-all">
                        <i data-lucide="check-circle" class="w-5 h-5"></i> Konfirmasi Persiapan
                    </button>
                </div>
            `;
            document.getElementById('alokasi-content').innerHTML = content;
            document.getElementById('modal-alokasi').classList.remove('hidden');
            lucide.createIcons();
        }

        window.closeModalAlokasi = function() { document.getElementById('modal-alokasi').classList.add('hidden'); }

        window.konfirmasiAlokasi = async function() {
            const tanggal_kirim = document.getElementById('input-tanggal-kirim').value;
            const ekspedisi = document.getElementById('input-ekspedisi-persiapan').value.trim();
            if (!tanggal_kirim) return showToast('Tanggal Kirim wajib diisi', 'error');
            if (!ekspedisi) return showToast('Ekspedisi wajib diisi', 'error');

            const res = await fetchAPI('konfirmasiDelivery', { no_po: alokasiState.no_po, alokasi: alokasiState.alokasi, tanggal_kirim, ekspedisi }, true);
            if(res.success) {
                showToast(res.message); closeModalAlokasi();
                if(window.location.hash === '#persiapan') renderPersiapan(); else if(window.location.hash === '#rekap-po') renderRekapPO();
            } else { showToast(res.message, 'error'); }
        }

            container.innerHTML = `<div class="animate-pulse h-64 bg-gray-200 border border-gray-300 rounded-xl w-full mt-4"></div>`;

                container.innerHTML = `<div class="p-8 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-200">${res?.message || 'Gagal'}</div>`; return;

                g.items.forEach(it => {
                    rowNo++;

                        <td class="py-2 px-3 whitespace-nowrap">${tglTrans}</td>
                        <td class="py-2 px-3 whitespace-nowrap font-medium text-blue-700">${tglKirim}</td>

                        <td class="py-2 px-3 text-center">${sjBadge}</td>
                    </tr>`;
                });
                bodyRows += `
                    <tr class="bg-blue-50/50 border-b-2 border-blue-200">
                        <td colspan="10" class="py-2 px-3 text-right font-bold text-blue-800">Total DR ${g.no_dr}</td>
                        <td class="py-2 px-3 text-right font-extrabold text-blue-900">${g.total_qty}</td>
                        <td class="py-2 px-3"></td>
                    </tr>`;
            });

            container.innerHTML = createCard(`
                <div class="overflow-x-auto w-full max-w-full rounded-lg border border-gray-200">
                    <table class="w-full text-sm text-left whitespace-nowrap">
                        <thead class="bg-blue-500 text-white">
                            <tr>
                                <th class="py-3 px-3">No</th>
                                <th class="py-3 px-3">Tgl Trans</th>
                                <th class="py-3 px-3">Tgl Kirim</th>

        window.buatSuratJalan = async function(no_dr) {
            const res = await fetchAPI('createSuratJalan', { no_dr }, true);

        }

        let collyModalState = { no_surat_jalan: null, sj: null, customer: null, items: [], lastValidasi: null };

        window.bukaCetakSJ = async function(no_surat_jalan) {
            const res = await fetchAPI('getSuratJalanCetakData', { no_surat_jalan });
            if (!res || !res.success) return showToast(res?.message || 'Gagal memuat data Surat Jalan', 'error');

            const d = res.data;
            collyModalState = {
                no_surat_jalan: no_surat_jalan, sj: d.sj, customer: d.customer,
                items: d.items.map(it => ({
                    kode_barang: it.kode_barang, nama_barang: it.nama_barang, satuan: it.satuan || '-', qty_sj: it.qty_sj,
                    collies: it.collies.length > 0 ? it.collies.map(c => c.qty) : [it.qty_sj]
                })),
                lastValidasi: null
            };
            renderModalCetakSJ();
            document.getElementById('modal-cetak-sj').classList.remove('hidden');
        }

        window.closeModalCetakSJ = function() { document.getElementById('modal-cetak-sj').classList.add('hidden'); }

        function renderModalCetakSJ() {
            const s = collyModalState;
            const itemRows = s.items.map((it, itemIdx) => {
                const totalColly = it.collies.reduce((a, b) => a + (parseInt(b, 10) || 0), 0);
                const match = totalColly === it.qty_sj;
                const selisih = totalColly - it.qty_sj;

                const collyInputs = it.collies.map((qty, cIdx) => `
                    <div class="flex items-center gap-2 mb-1.5">
                        <span class="text-xs text-gray-400 w-16">Colly ${cIdx + 1}</span>
                        <input type="number" min="0" value="${qty}" onchange="updateCollyQty(${itemIdx}, ${cIdx}, this.value)" class="w-24 border border-gray-300 rounded px-2 py-1.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <span class="text-xs text-gray-400">pcs</span>
                        <button onclick="hapusColly(${itemIdx}, ${cIdx})" class="text-red-400 hover:text-red-600 p-1 ml-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `).join('');

                return `
                <div class="border border-gray-200 rounded-lg p-4 mb-3">
                    <div class="flex justify-between items-start mb-2 gap-2">
                        <div>
                            <p class="font-bold text-gray-800">${it.nama_barang}</p>

                            <i data-lucide="${match ? 'check-circle' : 'alert-triangle'}" class="w-3.5 h-3.5"></i>

                </div>`;

            const html = `

                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Disetujui Oleh</label>
                            <input id="input-disetujui" type="text" value="${s.sj.disetujui_oleh || ''}" placeholder="Nama SPV/Atasan" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Ekspedisi</label>
                            <input id="input-ekspedisi" type="text" value="${s.sj.ekspedisi || ''}" placeholder="Nama ekspedisi/kurir" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>
                    <h4 class="font-bold text-gray-700 mb-3 flex items-center gap-2"><i data-lucide="package" class="w-4 h-4"></i> Rincian Qty per Colly</h4>
                    ${itemRows || '<p class="text-sm text-gray-400">Tidak ada item pada Surat Jalan ini.</p>'}
                </div>
                
                <!-- TOMBOL-TOMBOL AKSI -->
                <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex flex-col sm:flex-row justify-end gap-3 flex-shrink-0">
                    <button onclick="closeModalCetakSJ()" class="px-5 py-2.5 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition-colors">Tutup</button>
                    <button onclick="simpanRincianColly()" class="px-5 py-2.5 bg-gray-700 text-white font-bold rounded-lg hover:bg-gray-800 flex items-center justify-center gap-2 transition-colors"><i data-lucide="save" class="w-5 h-5"></i> Simpan Rincian</button>
                    
                    <!-- TOMBOL CETAK LABEL (BARU) -->
                    <button onclick="cetakLabelColly()" class="px-5 py-2.5 bg-yellow-500 text-white font-bold rounded-lg hover:bg-yellow-600 flex items-center justify-center gap-2 shadow-md transition-all"><i data-lucide="tags" class="w-5 h-5"></i> Cetak Label</button>
                    
                    <button onclick="cetakDokumenSJ()" class="px-5 py-2.5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 flex items-center justify-center gap-2 shadow-md transition-all"><i data-lucide="printer" class="w-5 h-5"></i> Cetak SJ</button>
                </div>

            document.getElementById('modal-cetak-sj-body').innerHTML = html;
            lucide.createIcons();

        window.tambahColly = function(itemIdx) { collyModalState.items[itemIdx].collies.push(0); renderModalCetakSJ(); }
        window.hapusColly = function(itemIdx, collyIdx) {
            const collies = collyModalState.items[itemIdx].collies;
            if (collies.length <= 1) return showToast('Minimal harus ada 1 colly per item', 'error');
            collies.splice(collyIdx, 1); renderModalCetakSJ();
        }
        window.updateCollyQty = function(itemIdx, collyIdx, value) {
            collyModalState.items[itemIdx].collies[collyIdx] = parseInt(value, 10) || 0; renderModalCetakSJ();
        }

        window.simpanRincianColly = async function() {
            const s = collyModalState;
            const payloadItems = s.items.map(it => ({ kode_barang: it.kode_barang, collies: it.collies.map(q => ({ qty: q })) }));
            const [resInfo, resColly] = await Promise.all([
                fetchAPI('updateSuratJalanInfo', { no_surat_jalan: s.no_surat_jalan, disiapkan_oleh: document.getElementById('input-disiapkan').value, disetujui_oleh: document.getElementById('input-disetujui').value, ekspedisi: document.getElementById('input-ekspedisi').value }, true),
                fetchAPI('saveSuratJalanColly', { no_surat_jalan: s.no_surat_jalan, items: payloadItems }, true)
            ]);

            if (resColly && resColly.success) {
                s.sj.disiapkan_oleh = document.getElementById('input-disiapkan').value;
                s.sj.disetujui_oleh = document.getElementById('input-disetujui').value;
                s.sj.ekspedisi = document.getElementById('input-ekspedisi').value;
                s.lastValidasi = resColly.data;
                showToast(resColly.message, resColly.data.semuaCocok ? 'success' : 'error');
                return true;
            } else {
                showToast(resColly?.message || resInfo?.message || 'Gagal menyimpan rincian', 'error');
                return false;
            }
        }

        // --- FUNGSI BARU: CETAK LABEL COLLY ---
        window.cetakLabelColly = async function() {
            const s = collyModalState;
            
            // Wajib simpan data (rincian qty) ke server dulu sebelum cetak label 
            const berhasilSimpan = await window.simpanRincianColly();
            if (!berhasilSimpan) return;

            // Generate Kotak-kotak Label 
            let labelBlocks = '';
            
            // Hitung total colly keseluruhan dari SJ ini
            let totalAllCollies = s.items.reduce((sum, item) => sum + item.collies.length, 0);
            let globalCollyCounter = 1;

            s.items.forEach(it => {
                it.collies.forEach((qty) => {
                    labelBlocks += `
                    <div class="label-container">
                        <div class="label-header">
                            <div>
                                PT SINARAYA NUGRAHA AHMADARIS MEDIKA<br>

                            </div>

                                <tr>
                                    <th style="width:15%">CODE</th>

                                    <td class="center font-bold">${it.kode_barang}</td>

                                    <td class="center font-bold" style="font-size:20px;">${qty}</td>
                                    <td class="center">${it.satuan}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>`;
                    
                    globalCollyCounter++;
                });
            });

            // HTML Page Setup

            <html>
            <head>
                <meta charset="UTF-8">
                <title>Cetak Label - ${s.no_surat_jalan}</title>
                <style>                    
                    @page { size: A4 portrait; margin: 10mm; }

                    /* Styling Kotak Label */
                    .label-container { 
                        border: 2px solid #000; 
                        margin-bottom: 20px; 
                        padding: 10px;
						page-break-after: always;
                        page-break-inside: avoid; /* Mencegah 1 label terpotong 2 halaman */
                        border-radius: 4px;
                        background: #fff;
                    }
                    .label-header { 
                        border-bottom: 2px solid #000; 
                        padding-bottom: 8px; 
                        margin-bottom: 10px; 
                        font-weight: bold; 
                        font-size: 30px; 
                        display: flex; 
                        justify-content: space-between;
                        align-items: center;
                    }
                    
                    /* Styling Tabel dalam Label */
                    table { width: 100%; border-collapse: collapse; }
                    th, td { border: 1px solid #000; padding: 8px 6px; text-align: left; vertical-align: middle; }
                    th { background-color: #f3f4f6; text-align: center; font-size: 20px; text-transform: uppercase; border-bottom: 2px solid #000;}
                    .center { text-align: center; }
                    .font-bold { font-weight: bold; }              
                </style>
            </head>
            <body>
                ${labelBlocks}
            </body>
            </html>`;

            const win = window.open('', '_blank');
            if (!win) return showToast('Popup diblokir browser. Izinkan popup.', 'error');
            win.document.write(printHtml);
            win.document.close();
            setTimeout(() => win.print(), 1000);
        }

        window.cetakDokumenSJ = async function() {
            const s = collyModalState;
            const berhasilSimpan = await window.simpanRincianColly();
            if (!berhasilSimpan) return;
            const semuaCocok = s.lastValidasi ? s.lastValidasi.semuaCocok : false;
            if (!semuaCocok) {
                const lanjut = confirm('Qty per colly masih ada yang TIDAK COCOK dengan qty persiapan barang. Tetap cetak Surat Jalan?');
                if (!lanjut) return;
            }

            const win = window.open('', '_blank');
            if (!win) return showToast('Popup diblokir browser.', 'error');
            win.document.write(buildHtmlCetakSJ(s,true));
            win.document.close();
            setTimeout(() => win.print(), 1000);
        }

					</div>
				</div>
			`;

			// CSS khusus jika double
			const doubleCSS = double ? `

					font-size: 12px;
